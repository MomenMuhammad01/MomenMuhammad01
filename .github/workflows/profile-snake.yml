name: Profile contribution snake
on:
  push:
    branches: [main]
    paths: [.github/workflows/profile-snake.yml]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-contribution-snake
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#155eef
            dist/snake-dark.svg?palette=github-dark&color_snake=#00c2a8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated images
        run: |
          cd dist
          git init -b output
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh contribution snake"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
